    <script>
      // Detecção de navegador incompatível (Tailwind v4 requer CSS @property — Chrome 111+, Safari 16.4+, Firefox 128+)

            throw 'unsupported';
          }
        } catch(e) {
          document.getElementById('root').innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;font-family:system-ui,sans-serif;text-align:center;background:#111;color:#fff">' +

              '</div>' +

              '<p style="font-size:14px;color:#aaa;max-width:320px;line-height:1.6;margin-bottom:24px">' +

              '</p>' +
              '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" ' +
                'style="display:inline-block;padding:14px 32px;background:#7c3aed;color:#fff;font-weight:800;font-size:14px;border-radius:12px;text-decoration:none">' +

              '</a>' +
              '<p style="font-size:11px;color:#555;margin-top:20px">Versão mínima: Chrome 111 · Safari 16.4 · Firefox 128</p>' +
            '</div>';
        }
      })();
